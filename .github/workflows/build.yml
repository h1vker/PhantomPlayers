name: Build PhantomPlayers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build plugin
        run: chmod +x ./gradlew && ./gradlew --no-daemon clean jar
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: CloverMC-PhantomPlayers
          path: build/libs/PhantomPlayers-*.jar
          if-no-files-found: error
