# CloverMC PhantomPlayers chat library
# Templates are selected without repeating until every template has played once.
# After the full library is exhausted, a new cycle begins.
settings:
  enabled: true
  min-delay-seconds: 2
  max-delay-seconds: 5
  conversation-cooldown-seconds: 4
  max-concurrent-conversations: 3
  max-lines-per-conversation: 8

selection:
  randomize-delays: true
  avoid-same-speaker-consecutively: true
  avoid-repeating-template: true

templates:
  hangout_01:
    weight: 7
    lines:
      - "{player1}: anyone doing anything after this"
      - "{player2}: probably just playing"
      - "{player3}: same, invite me if you start"
