# CloverMC PhantomPlayers chat library
# Templates are selected without repeating until every template has played once.
# After the full library is exhausted, a new cycle begins.
settings:
  enabled: true
  min-delay-seconds: 4
  max-delay-seconds: 8
  conversation-cooldown-seconds: 3
  max-concurrent-conversations: 4
  max-lines-per-conversation: 7

selection:
  randomize-delays: true
  avoid-same-speaker-consecutively: true
  avoid-repeating-template: true

templates:
  hangout_01:
    weight: 7
    lines:
      - "{player1}: any1 doing anything after this"
      - "{player2}: prob just playing"
      - "{player3}: same, invite me if u start"
